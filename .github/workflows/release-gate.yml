name: Release gate

# Builds the demo against a candidate sslabdata ref before that ref is tagged
# or pinned here. Build only: this workflow never deploys.

on:
  workflow_dispatch:
    inputs:
      sslabdata_ref:
        description: >-
          sslabdata git ref (tag, branch or full 40-character commit hash) to build against.
          Leave empty to use the pin in pyproject.toml.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      sslabdata_ref: ${{ inputs.sslabdata_ref }}
