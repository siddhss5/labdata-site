name: Build

# Builds the Example Lab demo end to end and uploads it as a Pages artifact.
# Called by pages.yml and release-gate.yml; it never deploys.

on:
  workflow_call:
    inputs:
      sslabdata_ref:
        description: >-
          sslabdata git ref (tag, branch or commit) to build against instead of
          the pin in pyproject.toml. Empty means the pin.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.15"

    # --locked fails if uv.lock does not match pyproject.toml, so a changed
    # pin cannot silently build the commit the old lockfile resolved.
    - name: Install pinned sslabdata
      run: |
        uv sync --locked

    - name: Install candidate sslabdata
      if: inputs.sslabdata_ref != ''
      env:
        SSLABDATA_REF: ${{ inputs.sslabdata_ref }}
      run: |
        uv pip install --reinstall-package sslabdata "sslabdata @ git+https://github.com/siddhss5/sslabdata@${SSLABDATA_REF}"

    # Later steps use --no-sync so a candidate sslabdata is not replaced by the pin.
    - name: Show sslabdata version
      run: |
        uv run --no-sync python -c "from importlib.metadata import distribution as d; x = d('sslabdata'); print(x.version, x.read_text('direct_url.json') or '(from PyPI)')"

    - name: Validate demo lab
      run: |
        uv run --no-sync sslabdata --config demo/lab.yaml --validate

    - name: Generate site data
      run: |
        uv run --no-sync sslabdata --config demo/lab.yaml --output site/_data/lab.yml
        uv run --no-sync python scripts/generate_site_config.py demo/lab.yaml site/_config.generated.yml
        uv run --no-sync python scripts/generate_pages.py site/_data/lab.yml site/_entities

    # actions/jekyll-build-pages only reads site/_config.yml, so build with
    # Jekyll directly to layer the settings generated from lab.yaml on top.
    - name: Set up Ruby
      uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
      with:
        ruby-version: '3.3'
        # Installs the gems pinned in site/Gemfile.lock (frozen) and caches them.
        bundler-cache: true
        working-directory: site

    # After Ruby, so the tests that build the site from a fixture run rather
    # than skip.
    - name: Run tests
      run: |
        uv run --no-sync pytest

    - name: Build Jekyll site
      working-directory: site
      env:
        BUNDLE_FROZEN: 'true'
        JEKYLL_ENV: production
        PAGES_REPO_NWO: ${{ github.repository }}
      run: bundle exec jekyll build --config _config.yml,_config.generated.yml --destination ../_site

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
