[project]
name = "sslabdata-site"
version = "0.0.0"
description = "Demo Jekyll renderer for documents produced by sslabdata"
requires-python = ">=3.10"
dependencies = [
    # The one place sslabdata is pinned, to an exact PyPI release; uv.lock records its
    # hashes. Regenerate it with `uv lock`.
    "sslabdata==5.0.0",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false
